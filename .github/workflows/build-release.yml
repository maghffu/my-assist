name: build-release

# CI deploy Hermes-Lite (menggantikan cargo build di VPS — Pilar workflow baru):
#   push ke main  -> release tag "nightly" (channel default VPS)
#   push tag v*   -> release stabil
# VPS men-poll release via deploy/poll-deploy.sh (systemd timer) — tanpa secrets.
#
# Container rockylinux:9 (glibc 2.34, aman turun ke VPS OpenCloudOS 9 / glibc 2.38).
# tesseract 5.3.2 + leptonica 1.84.0 dibuild dari source upstream — versi EXACT
# sama dengan yang terpasang di VPS (rpm .oc9 tidak bisa dipakai karena
# membutuhkan glibc 2.38). Hasil build di-cache, build berikutnya instan.
# Binary membutuhkan soname libtesseract.so.5 — symlink-nya dibuat otomatis
# oleh deploy/install-release.sh di VPS.

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-release
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: rockylinux:9
    env:
      # Di dalam workspace supaya bisa di-cache actions/cache (host hanya
      # melihat path yang di-bind-mount, bukan filesystem container).
      CARGO_HOME: ${{ github.workspace }}/.cargo-home
      RUSTUP_HOME: /usr/local/rustup
      PKG_CONFIG_PATH: /opt/tess/lib64/pkgconfig
    steps:
      - uses: actions/checkout@v5

      - name: Base toolchain + deps tesseract source build
        run: |
          # giflib-devel & openjpeg2-devel ada di repo CRB (default disabled)
          dnf -y --enablerepo=crb install gcc gcc-c++ clang make cmake curl tar git \
              openssl-devel pkg-config \
              libjpeg-turbo-devel libpng-devel libtiff-devel libwebp-devel \
              giflib-devel openjpeg2-devel libicu-devel libarchive-devel \
              > /tmp/base.log 2>&1 \
            || { echo "::error::BASE_DNF: $(tail -c 500 /tmp/base.log | tr '\n' ' ')"; exit 1; }

      - name: Cache tesseract/leptonica source build
        uses: actions/cache@v4
        with:
          path: /opt/tess
          key: tess-5.3.2-lept-1.84.0-v1

      - name: Build leptonica 1.84.0 + tesseract 5.3.2 dari source (sekali, cached)
        run: |
          if [[ -f /opt/tess/lib64/pkgconfig/tesseract.pc ]]; then
            echo "cache hit — skip source build"; exit 0
          fi
          set -e
          mkdir -p /tmp/tessbuild && cd /tmp/tessbuild
          curl -fsSL -o leptonica.tar.gz \
            https://github.com/DanBloomberg/leptonica/releases/download/1.84.0/leptonica-1.84.0.tar.gz
          curl -fsSL -o tesseract.tar.gz \
            https://github.com/tesseract-ocr/tesseract/archive/refs/tags/5.3.2.tar.gz
          tar xzf leptonica.tar.gz
          cmake -S leptonica-1.84.0 -B lept-build \
            -DCMAKE_BUILD_TYPE=Release -DBUILD_SHARED_LIBS=ON \
            -DCMAKE_INSTALL_PREFIX=/opt/tess -DBUILD_PROG=OFF
          cmake --build lept-build -j"$(nproc)" && cmake --install lept-build
          tar xzf tesseract.tar.gz
          cmake -S tesseract-5.3.2 -B tess-build \
            -DCMAKE_BUILD_TYPE=Release -DBUILD_SHARED_LIBS=ON \
            -DCMAKE_INSTALL_PREFIX=/opt/tess \
            -DBUILD_TRAINING_TOOLS=OFF -DBUILD_TESTS=OFF -DDISABLE_DOCS=ON \
            -DLEPTONICA_DIR=/opt/tess/lib64
          cmake --build tess-build -j"$(nproc)" && cmake --install tess-build
          pkg-config --modversion tesseract leptonica

      - name: Install Rust (stable)
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs \
            | sh -s -- -y --profile minimal --default-toolchain stable --no-modify-path
          echo "$CARGO_HOME/bin" >> "$GITHUB_PATH"

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            .cargo-home/registry
            .cargo-home/git
            target
          key: cargo-oc9-${{ hashFiles('Cargo.lock') }}
          restore-keys: cargo-oc9-

      - name: Build
        run: cargo build --release --locked

      - name: Sanity check linkage
        run: |
          objdump -p target/release/hermes-lite \
            | grep NEEDED | grep -E 'tesseract|leptonica|ssl|crypto' || true
          objdump -p target/release/hermes-lite | grep -q 'libtesseract.so.5' \
            || { echo "::error::DT_NEEDED libtesseract.so.5 tidak ada"; exit 1; }

      - name: Package tarball
        run: |
          SHA8="${GITHUB_SHA::8}"
          NAME="hermes-lite-${SHA8}-linux-x86_64"
          mkdir -p dist
          { echo "commit: ${GITHUB_SHA}"
            echo "ref:    ${GITHUB_REF_NAME}"
            echo "built:  $(date -u +%FT%TZ)"
          } > dist/BUILD_INFO
          cp target/release/hermes-lite       dist/
          cp deploy/install-release.sh        dist/install.sh
          cp soul.md deploy/hermes-lite.service dist/
          tar -C dist -czf "dist/${NAME}.tar.gz" \
              hermes-lite install.sh soul.md hermes-lite.service BUILD_INFO
          (cd dist && sha256sum "${NAME}.tar.gz" > "${NAME}.tar.gz.sha256")

      - uses: actions/upload-artifact@v4
        with:
          name: release-tarball
          path: dist/*

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: release-tarball
          path: dist

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          SHA8="${GITHUB_SHA::8}"
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            gh release create "$GITHUB_REF_NAME" dist/* \
              --title "$GITHUB_REF_NAME" --notes "Build $GITHUB_REF_NAME ($SHA8)"
          else
            # channel nightly: release lama dibuang, tag dipindah ke commit terbaru
            gh release delete nightly --cleanup-tag --yes 2>/dev/null || true
            gh release create nightly dist/* \
              --target "$GITHUB_SHA" --title "nightly $SHA8" \
              --notes "Auto-build main @ ${SHA8}"
          fi
